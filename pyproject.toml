[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-retail-analytics"
version = "0.1.0"
description = "A reproducible retail KPI pipeline using synthetic data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
ai = ["openai>=1.0,<2"]

[project.scripts]
retail-analytics = "retail_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
